# A2A server plugin bundle patch: insert the A2A bridge (dsh-nuncia) into a
# DSH profile. Override provider/model/port via a higher profile patch as needed.

- insert:
    - id: dsh-nuncia
      name: 'dsh-nuncia'
      config:
        path: /a2a
        agentCardPath: /.well-known/agent.json
        host: 127.0.0.1
        port: 4123
        agentPreset: standard
        auth:
          type: bearer
          tokenEnv: NUNCIA_A2A_TOKEN
        taskTtlMs: 3600000
        agentCard:
          name: Nuncia
          description: A DeepSeek Harness agent exposed over the Agent2Agent protocol
          url: http://127.0.0.1:4123/a2a
          version: 0.1.0
          capabilities:
            streaming: true
            pushNotifications: false
          skills:
            - id: general-assistant
              name: General Assistant
              description: Handles open-ended text tasks
              inputModes: [text/plain]
              outputModes: [text/plain]
